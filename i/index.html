<!doctype html>
<!-- Страница приглашения Avail (CRM, этап 5; docs/crm/phase5_contract.md §11.2).
     Ссылка из письма или сообщения: https://avail.asia/i/?k=<код> (короткая
     форма avail.asia/i/<код> приходит сюда через 404.html). Сначала просим
     открыть обычный браузер, если ссылку открыли внутри LINE / Facebook /
     Instagram / TikTok; потом показываем бонус и кнопки «Зарегистрироваться» /
     «Войти» в веб-версии (код уходит в адресе ?ref=… и в localStorage
     avail_ref на 48 часов). Названий компаний и имён здесь нет (OQ-8).
     Скрипт — отдельными файлами (CSP без встроенных скриптов), тексты —
     только через textContent. Не индексируется, без внешних шрифтов и
     счётчиков. Та же разметка — в site/p/index.html (промокоды). -->
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://paikboidnrgthyxpwdrk.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Avail</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Avail">
<meta property="og:title" content="Avail — бесплатные объявления на Пхукете">
<meta property="og:description" content="Free classifieds in Phuket · ประกาศฟรีในภูเก็ต">
<meta property="og:image" content="https://avail.asia/assets/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="../assets/img/logo.png">
<link rel="stylesheet" href="../i/ref.css">
<script src="../i/ref_texts.js" defer></script>
<script src="../i/ref.js" defer></script>
</head>
<body data-mode="i">
<div class="page">
<header class="top">
  <a class="brand" href="/" id="home"><img src="../assets/img/logo.png" alt="" width="30" height="30"><span>Avail</span></a>
  <label class="lang"><span class="sr" id="lang_label">Язык</span>
    <select id="lang">
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="th">ไทย</option>
      <option value="zh">中文</option>
      <option value="vi">Tiếng Việt</option>
      <option value="id">Indonesia</option>
      <option value="ms">Melayu</option>
      <option value="km">ខ្មែរ</option>
    </select>
  </label>
</header>

<main id="main" aria-live="polite">
  <p class="banner test" id="test_banner" hidden></p>
  <p class="banner preview" id="preview_banner" hidden></p>

  <section id="s_loading">
    <p class="muted" id="loading_text">…</p>
  </section>

  <section id="s_nocode" hidden>
    <h1 id="nocode_title"></h1>
    <p class="lead" id="nocode_text"></p>
    <a class="btn btn-primary" id="nocode_btn" href="/p/"></a>
  </section>

  <section id="s_enter" hidden>
    <span class="badge" id="enter_badge"></span>
    <h1 id="enter_title"></h1>
    <p class="lead" id="enter_hint"></p>
    <div class="enter">
      <label class="sr" for="enter_input" id="enter_label"></label>
      <input id="enter_input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40">
      <button type="button" class="btn btn-primary" id="enter_btn"></button>
    </div>
    <p class="msg" id="enter_msg" role="alert" hidden></p>
    <a class="btn btn-sec" id="enter_noreg" href="/app/#/home/profile/registration"></a>
  </section>

  <section id="s_inapp" hidden>
    <div class="warn"><i aria-hidden="true">!</i><div><h1 id="inapp_title"></h1><p id="inapp_text"></p></div></div>
    <a class="btn btn-primary" id="inapp_open" href="/" hidden></a>
    <div class="card how">
      <p class="how-t" id="inapp_how"></p>
      <ol><li id="inapp_1"></li><li id="inapp_2"></li></ol>
    </div>
    <div class="or"><span id="inapp_or"></span></div>
    <input class="urlbox" id="inapp_url" type="text" readonly aria-label="URL">
    <button type="button" class="btn btn-primary" id="inapp_copy"></button>
    <p class="small muted center" id="inapp_paste"></p>
    <button type="button" class="btn btn-locked" id="inapp_locked" disabled></button>
    <button type="button" class="linkbtn" id="inapp_here"></button>
  </section>

  <section id="s_main" hidden>
    <span class="badge" id="badge"></span>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <p class="note" id="state_text" hidden></p>
    <div class="bonus" id="bonus" hidden>
      <p class="bonus-t" id="bonus_title"></p>
      <div class="tiles" id="tiles">
        <div class="tile" id="tile_now"><b id="bonus_now_n"></b><span id="bonus_now_t"></span></div>
        <div class="tile" id="tile_after"><b id="bonus_after_n"></b><span id="bonus_after_t"></span></div>
      </div>
      <p class="small" id="bonus_note"></p>
    </div>
    <a class="btn btn-primary" id="reg" href="/app/#/home/profile/registration"><span id="reg_1"></span><small id="reg_2"></small></a>
    <div class="card login"><p id="have_q"></p><a id="login" href="/app/#/home/profile/login"></a></div>
    <div class="card code">
      <div><p class="lbl" id="code_title"></p><p class="val" id="code"></p></div>
      <button type="button" class="copy" id="code_copy"></button>
    </div>
    <p class="small muted center" id="help"></p>
  </section>

  <section id="s_invalid" hidden>
    <h1 id="invalid_title"></h1>
    <p class="lead" id="invalid_text"></p>
    <p class="small muted" id="invalid_code"></p>
    <a class="btn btn-primary" id="noreg" href="/app/#/home/profile/registration"></a>
    <a class="btn btn-sec" id="other_code" href="/p/"></a>
  </section>

  <section id="s_done" hidden>
    <div class="done-head"><span class="chk" aria-hidden="true">✓</span>
      <div><h1 id="done_title"></h1><p id="done_sub"></p></div></div>
    <div class="paid" id="paid_box" hidden><b id="paid_text"></b></div>
    <p class="note" id="done_text" hidden></p>
    <div class="card steps" id="steps" hidden>
      <p id="steps_title"></p>
      <ol><li><i>1</i><span id="step1"></span></li><li><i>2</i><span id="step2"></span></li><li><i>+</i><span id="step3"></span></li></ol>
    </div>
    <p class="install-t" id="install_title"></p>
    <div class="stores">
      <a class="store" href="https://apps.apple.com/app/id6466668151" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 1.43c0 1.14-.47 2.27-1.2 3.08-.79.88-2.06 1.55-3.12 1.47-.13-1.11.43-2.28 1.14-3.03.79-.85 2.15-1.48 3.18-1.52zM20.6 17.3c-.55 1.27-.82 1.84-1.53 2.96-.99 1.56-2.39 3.51-4.12 3.52-1.54.02-1.94-1-4.03-.99-2.09.01-2.53 1.01-4.07.99-1.73-.02-3.05-1.77-4.04-3.33C.04 16.08-.25 11.1 1.47 8.43c1.22-1.9 3.15-3.01 4.96-3.01 1.85 0 3.01 1.01 4.54 1.01 1.48 0 2.38-1.01 4.52-1.01 1.61 0 3.32.88 4.54 2.4-3.99 2.19-3.34 7.89.57 9.48z"/></svg><span><small id="sb_app"></small><b>App Store</b></span></a>
      <a class="store" href="https://play.google.com/store/apps/details?id=com.asiaavail.avail" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#3AA5F0" d="M3.6 1.8 13.4 12l-9.8 10.2c-.36-.2-.6-.6-.6-1.1V2.9c0-.5.24-.9.6-1.1z"/><path fill="#EC3B77" d="m16.7 8.6-3.3 3.4-9.8-10.2c.3-.16.7-.17 1.07.04z"/><path fill="#f7c948" d="M20.4 10.7c.8.45.8 2.15 0 2.6l-3.7 2.1-3.3-3.4 3.3-3.4z"/><path fill="#7c5cff" d="M16.7 15.4 4.67 22.16c-.37.2-.77.2-1.07.04L13.4 12z"/></svg><span><small id="sb_google"></small><b>Google Play</b></span></a>
    </div>
    <p class="hint" id="install_hint"></p>
    <div class="or"><span id="done_or"></span></div>
    <a class="btn btn-sec" id="continue" href="/app/"></a>
  </section>

  <input class="sr" id="clip" type="text" readonly tabindex="-1" aria-hidden="true">
  <noscript><p>Please turn on JavaScript to open the invitation. · Включите JavaScript, чтобы открыть приглашение.<br>
    <a href="/app/#/home/profile/registration">avail.asia/app</a></p></noscript>
</main>

<footer>
  <p class="small muted" id="legal"><span id="legal_a"></span><a id="terms" href="/legal/terms/"></a><span id="legal_b"></span><a id="privacy" href="/legal/privacy/"></a><span id="legal_c"></span></p>
</footer>
</div>
</body></html>
