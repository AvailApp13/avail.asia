<!doctype html>
<!-- Отписка от писем Avail (CRM). Ссылка из письма: https://avail.asia/u/?t=<токен>
     (короткая форма /u/<токен> приходит сюда через 404.html). Открытие
     страницы НИЧЕГО не меняет — отписывает только кнопка (POST в функцию
     crm-unsubscribe). Скрипт — отдельным файлом u.js (CSP без встроенных
     скриптов), тексты выводятся только через textContent. Не индексируется,
     без внешних шрифтов и счётчиков. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://paikboidnrgthyxpwdrk.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Avail</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px 16px; background: #fff; color: #1a1a1a;
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Noto Sans", sans-serif; }
  main { width: 100%; max-width: 440px; text-align: center; }
  .brand { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; color: #3AA5F0; margin-bottom: 4px; }
  .brand span { color: #EC3B77; }
  .langs { font-size: 14px; color: #999; margin-bottom: 28px; }
  .langs button { background: none; border: 0; padding: 4px 6px; font: inherit; color: #4682b4; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: #1a1a1a; font-weight: 700; cursor: default; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 10px; }
  p { margin: 0 0 22px; color: #555; }
  .act { display: block; width: 100%; min-height: 50px; border: 0; border-radius: 12px; padding: 12px 18px;
         background: #3AA5F0; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .act:focus-visible, .langs button:focus-visible { outline: 3px solid #1a1a1a; outline-offset: 2px; }
  .act[disabled] { opacity: .6; cursor: default; }
  .ok h1 { color: #1f8a4c; }
  [hidden] { display: none !important; }
</style>
<script src="u.js" defer></script>
</head>
<body>
<main id="box" aria-live="polite">
  <div class="brand" aria-label="Avail">Avai<span>l</span></div>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="ru">RU</button> ·
    <button type="button" data-lang="en">EN</button> ·
    <button type="button" data-lang="th">TH</button>
  </div>
  <h1 id="title">Avail</h1>
  <p id="text"></p>
  <button type="button" class="act" id="go" hidden></button>
  <button type="button" class="act" id="retry" hidden></button>
  <noscript><p>Please turn on JavaScript, or email hello@avail.asia with the word «unsubscribe».<br>
    Включите JavaScript или напишите на hello@avail.asia слово «unsubscribe».</p></noscript>
</main>
</body></html>
